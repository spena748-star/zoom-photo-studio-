<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ AI Object Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0f0c29 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        /* HEADER COMPACTO */
        .header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #e94560, #c23152);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3em;
            box-shadow: 0 2px 10px rgba(233, 69, 96, 0.5);
        }
        .header h1 { font-size: 1.1em; font-weight: 700; }
        .header .status {
            margin-left: auto;
            font-size: 0.75em;
            color: #48bb78;
            display: flex; align-items: center; gap: 5px;
        }
        .status-dot {
            width: 8px; height: 8px; background: #48bb78;
            border-radius: 50%; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* CÁMARA CON DRAG */
        .camera-container {
            position: relative;
            width: 100%;
            padding: 15px;
            background: #0f0c29;
        }
        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(233, 69, 96, 0.4);
            touch-action: none;
            cursor: grab;
        }
        .camera-wrapper:active { cursor: grabbing; }
        .camera-wrapper.dragging {
            border-color: #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.6);
        }
        #video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform-origin: center center;
            pointer-events: none;
        }
        .camera-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 14px;
        }
        .corner {
            position: absolute; width: 20px; height: 20px;
            border-color: #e94560; border-style: solid;
        }
        .corner.tl { top: 10px; left: 10px; border-width: 3px 0 0 3px; }
        .corner.tr { top: 10px; right: 10px; border-width: 3px 3px 0 0; }
        .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 3px 3px; }
        .corner.br { bottom: 10px; right: 10px; border-width: 0 3px 3px 0; }
        
        .zoom-badge {
            position: absolute; bottom: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white; padding: 5px 12px;
            border-radius: 15px; font-size: 0.8em; font-weight: 600;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }
        .drag-hint {
            position: absolute; top: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(233, 69, 96, 0.9);
            color: white; padding: 5px 12px;
            border-radius: 15px; font-size: 0.75em; font-weight: 600;
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .camera-wrapper:hover .drag-hint,
        .camera-wrapper.dragging .drag-hint { opacity: 1; }

        /* CONTROLES EN CASCADA */
        .controls {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
        }
        .control-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px;
            backdrop-filter: blur(10px);
        }
        .control-card label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 10px;
            color: #e2e8f0;
        }
        .control-card label span {
            color: #e94560;
            font-weight: 700;
            font-size: 0.95em;
        }
        input[type="range"] {
            width: 100%; height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none; -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560, #c23152);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(233, 69, 96, 0.5);
        }
        input[type="color"] {
            width: 100%; height: 45px;
            border: none; border-radius: 10px;
            cursor: pointer; background: transparent;
        }
        select {
            width: 100%; padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white; font-size: 0.9em;
        }

        /* BOTONES */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 15px 15px;
        }
        .btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 12px;
            font-size: 0.95em; font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white;
        }
        .btn-capture {
            background: linear-gradient(135deg, #e94560, #f59e0b);
            color: white;
            box-shadow: 0 6px 25px rgba(233, 69, 96, 0.5);
            font-size: 1.1em;
            padding: 16px;
        }

        /* RESULTADO */
        .result-section {
            padding: 15px;
            background: #0f0c29;
            text-align: center;
        }
        .result-section h3 {
            font-size: 1.1em;
            margin-bottom: 12px;
            color: #e2e8f0;
        }
        .result-wrapper {
            background: 
                linear-gradient(45deg, #2d3748 25%, transparent 25%),
                linear-gradient(-45deg, #2d3748 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2d3748 75%),
                linear-gradient(-45deg, transparent 75%, #2d3748 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        #resultCanvas {
            max-width: 100%;
            border-radius: 8px;
            display: none;
        }
        .placeholder-text {
            color: #718096;
            font-size: 0.95em;
            padding: 30px 15px;
        }
        .save-hint {
            background: rgba(245, 158, 11, 0.2);
            border-left: 3px solid #f59e0b;
            padding: 10px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 0.8em;
            color: #fbbf24;
            display: none;
            text-align: left;
        }

        /* MODAL IA */
        .ai-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 12, 41, 0.97);
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .ai-modal.active { display: flex; }
        .ai-modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 350px;
            width: 100%;
            text-align: center;
        }
        .ai-spinner {
            width: 50px; height: 50px; margin: 0 auto 15px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ai-modal h2 { font-size: 1.2em; margin-bottom: 8px; }
        .ai-modal p { color: #a0aec0; font-size: 0.9em; margin-bottom: 15px; }
        .progress-bar {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f59e0b);
            width: 0%; transition: width 0.3s;
        }
        .progress-text {
            font-size: 0.85em; color: #718096; margin-top: 10px;
        }

        /* BOTÓN FLOTANTE DE MOVER */
        .float-move-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #e94560, #c23152);
            border-radius: 50%;
            display: none;
            align-items: center; justify-content: center;
            font-size: 1.5em;
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.5);
            z-index: 50;
            cursor: pointer;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .float-move-btn.active { display: flex; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo">✨</div>
        <h1>AI Object Studio</h1>
        <div class="status">
            <div class="status-dot"></div>
            <span id="statusText">Listo</span>
        </div>
    </div>

    <!-- CÁMARA -->
    <div class="camera-container">
        <div class="camera-wrapper" id="cameraWrapper">
            <video id="video" autoplay playsinline muted></video>
            <div class="camera-overlay"></div>
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <div class="drag-hint">✋ Arrastra para mover</div>
            <div class="zoom-badge" id="zoomIndicator">1.0x</div>
        </div>
    </div>

    <!-- CONTROLES EN CASCADA -->
    <div class="controls">
        <div class="control-card">
            <label>🔍 Zoom <span id="zoomValue">1.0x</span></label>
            <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1">
        </div>
        
        <div class="control-card">
            <label>🎨 Color de Fondo</label>
            <input type="color" id="bgColor" value="#ffffff">
        </div>

        <div class="control-card">
            <label>📐 Calidad</label>
            <select id="qualitySelect">
                <option value="800">Alta (800px)</option>
                <option value="1200" selected>Ultra (1200px)</option>
                <option value="1600">Máxima (1600px)</option>
            </select>
        </div>
    </div>

    <!-- BOTONES -->
    <div class="buttons">
        <button class="btn btn-primary" id="startBtn"> Iniciar Cámara</button>
        <button class="btn btn-warning" id="switchCameraBtn" disabled>🔄 Cambiar Cámara</button>
        <button class="btn btn-capture" id="captureBtn" disabled>✨ Capturar con IA</button>
        <button class="btn btn-danger" id="stopBtn" disabled>⏹️ Detener</button>
    </div>

    <!-- RESULTADO -->
    <div class="result-section">
        <h3>🎯 Resultado</h3>
        <div class="result-wrapper">
            <canvas id="resultCanvas" width="1200" height="900"></canvas>
            <p class="placeholder-text" id="placeholderText">Captura una foto y la IA quitará el fondo</p>
        </div>
        <p class="save-hint" id="saveHint">
            💡 <strong>iPhone:</strong> Mantén presionada la imagen<br>
            💡 <strong>Android:</strong> Se descarga sola
        </p>
    </div>

    <!-- BOTÓN FLOTANTE -->
    <div class="float-move-btn" id="floatMoveBtn">✋</div>

    <!-- MODAL IA -->
    <div class="ai-modal" id="aiModal">
        <div class="ai-modal-content">
            <div class="ai-spinner"></div>
            <h2 id="aiTitle">Cargando IA...</h2>
            <p id="aiMessage">Preparando modelo</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">0%</p>
        </div>
    </div>

    <script type="module">
        import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';

        const video = document.getElementById('video');
        const cameraWrapper = document.getElementById('cameraWrapper');
        const zoomSlider = document.getElementById('zoomSlider');
        const bgColor = document.getElementById('bgColor');
        const qualitySelect = document.getElementById('qualitySelect');
        const startBtn = document.getElementById('startBtn');
        const switchCameraBtn = document.getElementById('switchCameraBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resultCanvas = document.getElementById('resultCanvas');
        const resultCtx = resultCanvas.getContext('2d');
        const zoomIndicator = document.getElementById('zoomIndicator');
        const statusText = document.getElementById('statusText');
        const placeholderText = document.getElementById('placeholderText');
        const saveHint = document.getElementById('saveHint');
        const aiModal = document.getElementById('aiModal');
        const aiTitle = document.getElementById('aiTitle');
        const aiMessage = document.getElementById('aiMessage');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const floatMoveBtn = document.getElementById('floatMoveBtn');

        let stream = null;
        let isCameraActive = false;
        let currentZoom = 1;
        let currentFacingMode = 'environment';
        let modelLoaded = false;

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        // Cargar modelo IA
        async function loadModel() {
            if (modelLoaded) return;
            
            aiModal.classList.add('active');
            aiTitle.textContent = '🤖 Cargando IA...';
            aiMessage.textContent = 'Descargando modelo (solo la 1ra vez)';
            progressFill.style.width = '10%';
            progressText.textContent = '10%';

            try {
                // Precargar el modelo
                await removeBackground(new Image(), {
                    progress: (key, current, total) => {
                        if (total > 0) {
                            const percent = Math.round((current / total) * 90) + 10;
                            progressFill.style.width = percent + '%';
                            progressText.textContent = percent + '%';
                            aiMessage.textContent = `Descargando: ${percent}%`;
                        }
                    }
                }).catch(() => {}); // Ignorar error de imagen vacía
                
                modelLoaded = true;
                progressFill.style.width = '100%';
                progressText.textContent = '100%';
                aiMessage.textContent = 'Modelo listo';
                
                setTimeout(() => aiModal.classList.remove('active'), 500);
            } catch (err) {
                console.error('Error cargando modelo:', err);
            }
        }

        async function startCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode, 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 } 
                    }
                });
                
                video.srcObject = stream;
                await video.play();
                
                isCameraActive = true;
                statusText.textContent = currentFacingMode === 'user' ? 'Frontal' : 'Trasera';
                startBtn.disabled = true;
                switchCameraBtn.disabled = false;
                captureBtn.disabled = false;
                stopBtn.disabled = false;
                placeholderText.style.display = 'none';
                floatMoveBtn.classList.add('active');
                
                // Cargar modelo en background
                loadModel();
            } catch (err) {
                alert('Error cámara: ' + err.message);
            }
        }

        startBtn.addEventListener('click', startCamera);

        switchCameraBtn.addEventListener('click', async () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            await startCamera();
        });

        stopBtn.addEventListener('click', () => {
            isCameraActive = false;
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
                stream = null;
            }
            startBtn.disabled = false;
            switchCameraBtn.disabled = true;
            captureBtn.disabled = true;
            stopBtn.disabled = true;
            floatMoveBtn.classList.remove('active');
            statusText.textContent = 'Detenido';
        });

        zoomSlider.addEventListener('input', (e) => {
            currentZoom = parseFloat(e.target.value);
            document.getElementById('zoomValue').textContent = currentZoom.toFixed(1) + 'x';
            zoomIndicator.textContent = currentZoom.toFixed(1) + 'x';
            video.style.transform = `scale(${currentZoom})`;
        });

        // DRAG para mover la cámara
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentTranslateX = 0, currentTranslateY = 0;

        function handleDragStart(e) {
            if (!isCameraActive) return;
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX - currentTranslateX;
            startY = touch.clientY - currentTranslateY;
            cameraWrapper.classList.add('dragging');
            e.preventDefault();
        }

        function handleDragMove(e) {
            if (!isDragging) return;
            const touch = e.touches ? e.touches[0] : e;
            currentTranslateX = touch.clientX - startX;
            currentTranslateY = touch.clientY - startY;
            video.style.transform = `scale(${currentZoom}) translate(${currentTranslateX}px, ${currentTranslateY}px)`;
            e.preventDefault();
        }

        function handleDragEnd() {
            isDragging = false;
            cameraWrapper.classList.remove('dragging');
        }

        cameraWrapper.addEventListener('mousedown', handleDragStart);
        cameraWrapper.addEventListener('touchstart', handleDragStart, { passive: false });
        window.addEventListener('mousemove', handleDragMove);
        window.addEventListener('touchmove', handleDragMove, { passive: false });
        window.addEventListener('mouseup', handleDragEnd);
        window.addEventListener('touchend', handleDragEnd);

        floatMoveBtn.addEventListener('click', () => {
            cameraWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
            alert('✋ Ahora arrastra la cámara con tu dedo para reposicionarla');
        });

        // CAPTURAR CON IA
        captureBtn.addEventListener('click', async () => {
            if (!isCameraActive) return;
            captureBtn.disabled = true;

            try {
                aiModal.classList.add('active');
                aiTitle.textContent = '📸 Capturando...';
                aiMessage.textContent = 'Tomando foto con zoom';
                progressFill.style.width = '20%';
                progressText.textContent = '20%';

                // Capturar frame con zoom y posición
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                
                tempCanvas.width = vw;
                tempCanvas.height = vh;
                
                tempCtx.translate(vw/2 + currentTranslateX, vh/2 + currentTranslateY);
                tempCtx.scale(currentZoom, currentZoom);
                tempCtx.translate(-vw/2, -vh/2);
                tempCtx.drawImage(video, 0, 0, vw, vh);

                progressFill.style.width = '30%';
                aiTitle.textContent = '🤖 IA Procesando...';
                aiMessage.textContent = 'Eliminando fondo del objeto';

                // Procesar con IA
                const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/png'));
                const resultBlob = await removeBackground(blob, {
                    progress: (key, current, total) => {
                        if (total > 0) {
                            const percent = 30 + Math.round((current / total) * 50);
                            progressFill.style.width = percent + '%';
                            progressText.textContent = percent + '%';
                        }
                    }
                });

                progressFill.style.width = '85%';
                aiTitle.textContent = '✨ Creando imagen...';
                aiMessage.textContent = 'Aplicando fondo elegante';

                // Cargar resultado
                const img = new Image();
                img.onload = () => {
                    const outSize = parseInt(qualitySelect.value);
                    const outHeight = Math.round(outSize * 0.75);
                    resultCanvas.width = outSize;
                    resultCanvas.height = outHeight;

                    // Fondo
                    resultCtx.fillStyle = bgColor.value;
                    resultCtx.fillRect(0, 0, outSize, outHeight);

                    // Dibujar objeto
                    const scale = Math.min(outSize / img.width, outHeight / img.height) * 0.92;
                    const drawW = img.width * scale;
                    const drawH = img.height * scale;
                    const x = (outSize - drawW) / 2;
                    const y = (outHeight - drawH) / 2;

                    resultCtx.shadowColor = 'rgba(0,0,0,0.2)';
                    resultCtx.shadowBlur = 25;
                    resultCtx.shadowOffsetY = 12;
                    resultCtx.drawImage(img, x, y, drawW, drawH);
                    resultCtx.shadowColor = 'transparent';

                    progressFill.style.width = '100%';
                    progressText.textContent = '100%';
                    aiTitle.textContent = '✅ ¡Listo!';
                    aiMessage.textContent = 'Foto profesional creada';

                    setTimeout(() => {
                        aiModal.classList.remove('active');
                        resultCanvas.style.display = 'block';
                        placeholderText.style.display = 'none';
                        
                        if (isIOS()) saveHint.style.display = 'block';

                        const link = document.createElement('a');
                        link.download = 'ai_object_' + Date.now() + '.png';
                        link.href = resultCanvas.toDataURL('image/png');
                        link.click();
                        
                        captureBtn.disabled = false;
                    }, 600);
                };
                img.src = URL.createObjectURL(resultBlob);

            } catch (err) {
                aiModal.classList.remove('active');
                captureBtn.disabled = false;
                alert('Error IA: ' + err.message);
                console.error(err);
            }
        });
    </script>
</body>
</html>
